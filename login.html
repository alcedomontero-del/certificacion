<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Portal de Certificados</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <svg class="seal" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="20" r="14" fill="#C9A227"/>
        <path d="M16 30 L13 44 L24 38 L35 44 L32 30" fill="#1B3A5C" opacity="0.85"/>
        <text x="24" y="25" font-size="14" text-anchor="middle" fill="#1B3A5C" font-family="serif">🔐</text>
      </svg>
      <h1>Panel de administrador</h1>
      <p class="sub">Portal de Certificados</p>

      <div id="badge-modo" style="margin-bottom: 18px;"></div>

      <div class="form-error" id="login-error"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-navy btn-block" id="btn-login">Iniciar sesión</button>
      </form>

      <div class="demo-hint" id="pista-demo" style="display:none;">
        🧪 <strong>Modo demostración:</strong> usa <strong>admin@demo.com</strong> / <strong>demo1234</strong> para entrar. Estos datos solo existen en tu navegador.
      </div>

      <p style="margin-top: 22px;"><a href="index.html" style="color: var(--ink-soft); font-weight: 700; font-size: 13.5px;">← Volver al portal</a></p>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
